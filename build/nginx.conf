server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # les appels à l'API sont relayés vers le service api.nrv (même origine => pas de CORS)
    location /api/ {
        proxy_pass http://api.nrv:80;
        proxy_set_header Host $host;
    }

    # sources et outillage du front : non servis
    location ~ ^/(scss|node_modules)/ {
        deny all;
    }

    location ~ ^/package(-lock)?\.json$ {
        deny all;
    }

    location / {
        # en développement : le navigateur revalide toujours html/css/js (évite d'exécuter un ancien js en cache)
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
