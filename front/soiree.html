<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRV.net - Détail de la soirée</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/soiree.js" defer></script>
    <script type="module" src="js/navigation-auth.js"></script>
    <script type="module" src="js/ajout-panier.js"></script>
    <script type="module" src="js/ajout-pass.js"></script>
</head>
<body>
    <header class="auth-navigation" data-navigation-auth>
        <a class="auth-marque" href="index.html">NRV.net</a>

        <nav aria-label="Navigation principale">
            <a href="index.html">Programme</a>

            <a href="panier.html">🛒 Panier</a>

            <a href="mes-billets.html">Mes billets</a>

            <span data-auth-invite>
                <a href="connexion.html" data-lien-connexion>
                    Connexion / inscription
                </a>
            </span>

            <span data-auth-connecte hidden>
                <span>Bonjour <span data-auth-nom></span></span>

                <button
                    class="auth-bouton auth-bouton--secondaire"
                    type="button"
                    data-auth-deconnexion
                >
                    Se déconnecter
                </button>
            </span>
        </nav>

        <p
            class="auth-message"
            data-auth-message
            role="status"
            hidden
        ></p>
    </header>
    <main class="page-soiree">
        <a href="index.html" class="bouton-retour">← Retour à l'accueil</a>
        <p class="message" id="soiree-message">Chargement de la soirée...</p>

        <div id="soiree"></div>

        <section class="ajout-panier" id="ajout-panier" aria-labelledby="ajout-panier-titre" hidden>
            <h2 id="ajout-panier-titre">Acheter des billets</h2>

            <form id="form-ajout-panier">
                <div class="ajout-panier-champ">
                    <label for="ajout-panier-tarif">Tarif</label>
                    <select id="ajout-panier-tarif" name="tarif_id" required></select>
                </div>

                <div class="ajout-panier-champ">
                    <label for="ajout-panier-quantite">Nombre de billets</label>
                    <input
                        id="ajout-panier-quantite"
                        name="quantite"
                        type="number"
                        inputmode="numeric"
                        min="1"
                        step="1"
                        value="1"
                        required
                    >
                </div>

                <button class="auth-bouton" type="submit">Ajouter au panier</button>
            </form>

            <p id="ajout-panier-message" class="auth-message" role="status" hidden></p>
        </section>

        <section class="ajout-pass" id="ajout-pass" aria-labelledby="ajout-pass-titre" hidden>
            <div class="ajout-pass-entete">
                <div>
                    <h2 id="ajout-pass-titre">Pass 3 jours à −3 %</h2>
                    <p>3 soirées au choix, pas forcément à la suite.</p>
                </div>

                <button
                    class="auth-bouton auth-bouton--secondaire"
                    type="button"
                    id="ajout-pass-choisir"
                    aria-expanded="false"
                    aria-controls="form-ajout-pass"
                >
                    Choisir
                </button>
            </div>

            <form id="form-ajout-pass" hidden>
                <fieldset class="ajout-pass-soirees">
                    <legend>
                        Soirées du pass
                        <span class="ajout-pass-compteur" id="ajout-pass-compteur" aria-live="polite"></span>
                    </legend>

                    <ul class="ajout-pass-liste" id="ajout-pass-liste"></ul>
                </fieldset>

                <div class="ajout-panier-champ">
                    <label for="ajout-pass-tarif">Tarif</label>
                    <select id="ajout-pass-tarif" name="tarif_id" required></select>
                </div>

                <button class="auth-bouton" type="submit" disabled>Ajouter le pass au panier</button>
            </form>

            <p id="ajout-pass-message" class="auth-message" role="status" hidden></p>
        </section>
    </main>

    <template id="soiree-template">
        <article class="soiree-detail">
            <h1 class="nom"></h1>
            <h2 class="thematique"></h2>
            <p class="date"></p>
            <p class="lieu">Lieu : <span class="nom-lieu"></span></p>
            <p class="capacite">Capacité : <span class="capacite-valeur"></span> places</p>
            <p class="tarif">
                Tarifs : <span class="tarifs-valeurs"></span>
            </p>

            <h3>Artistes</h3>
            <p class="artistes-soiree"></p>

            <h3>Programme</h3>
            <ul class="liste-spectacles"></ul>
        </article>
    </template>

    <template id="soiree-spectacle-template">
        <li class="spectacle">
            <h4 class="titre"></h4>
            <p class="artistes">Artistes : </p>
            <p class="styles">Styles : </p>
            <p class="description">Description : </p>
            <a class="video" target="_blank" rel="noopener">Voir la vidéo</a>
        </li>
    </template>

    <template id="ajout-pass-option-template">
        <li>
            <label class="ajout-pass-option">
                <input type="checkbox" name="soiree_ids">
                <span class="ajout-pass-nom"></span>
                <span class="ajout-pass-date"></span>
                <span class="badge">Complet</span>
            </label>
        </li>
    </template>
</body>
</html>
