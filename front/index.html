<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRV.net - Programme du festival</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/spectacles.js" defer></script>
    <script type="module" src="js/navigation-auth.js"></script>
</head>
<body>
    <header class="auth-navigation" data-navigation-auth>
        <a class="auth-marque" href="index.html">NRV.net</a>

        <nav aria-label="Navigation principale">
            <a href="index.html">Programme</a>

            <span data-auth-invite>
                <a href="connexion.html" data-lien-connexion>
                    Connexion / inscription
                </a>
            </span>

            <span data-auth-connecte hidden>
                <span>Bonjour <span data-auth-nom></span></span>

                <button
                    class="auth-bouton auth-bouton--secondaire"
                    type="button"
                    data-auth-deconnexion
                >
                    Se déconnecter
                </button>
            </span>
        </nav>

        <p
            class="auth-message"
            data-auth-message
            role="status"
            hidden
        ></p>
    </header>
    <main class="programme">
        <h1 class="titre">Programme du festival</h1>
        <p class="sous-titre" id="programme-resume"></p>

        <div class="barre">
            <form class="filtres">
                <div class="champ">
                    <label for="filtre-date">Date</label>
                    <select id="filtre-date" name="date">
                        <option value="">Toutes les dates</option>
                    </select>
                </div>

                <div class="champ">
                    <label for="filtre-style">Style de musique</label>
                    <select id="filtre-style" name="style">
                        <option value="">Tous les styles</option>
                    </select>
                </div>
            </form>

            <p class="compteur" id="spectacles-compteur"></p>
        </div>

        <p class="message" id="spectacles-message">Chargement des spectacles...</p>

        <ul class="liste" id="spectacles-liste"></ul>
    </main>

    <template id="spectacle-template">
        <li>
            <a class="lien" href="#">
            <article class="carte">
                <div class="media">
                    <img src="" alt="" loading="lazy">
                </div>
                <div class="contenu">
                    <span class="badge"></span>
                    <h2 class="nom"></h2>
                    <p class="infos">
                        <time class="date"></time>
                        ·
                        <time class="horaire"></time>
                    </p>
                </div>
            </article>
            </a>
        </li>
    </template>
</body>
</html>
