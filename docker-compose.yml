networks:
  nrv.net:
    driver: bridge

services:
  # service api.nrv : api de la billetterie du festival
  #
  api.nrv:
    build:
      context: build
      dockerfile: 8.5-cli.Dockerfile
    ports:
      - '7080:80'
    volumes:
      - ./app:/var/php
    working_dir: /var/php
    networks:
      - nrv.net
    depends_on:
      - nrv.db

    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"


  # service web.nrv : front de la billetterie (html/js statique)
  #
  web.nrv:
    image: 'nginx:1.27-alpine'
    ports:
      - '7081:80'
    volumes:
      - ./front:/usr/share/nginx/html:ro
      - ./build/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nrv.net
    depends_on:
      - api.nrv


  nrv.db:
    image: 'postgres:18.6'
    env_file: ./nrv.env
    ports:
      - '5532:5432'
    networks:
      - nrv.net
    volumes:
      - ./app/sql:/var/sql


  adminer:
    image: adminer
    ports:
      - '8880:8080'
    networks:
      - nrv.net
